name: Deploy to GitHub Pages

# Replaces the built-in "Deploy from a branch" (legacy) Pages build. The legacy
# builder has no cancel-in-progress control, so when several commits land within
# a minute or two (a release publishes the GDD, then the dashboard status JSON,
# then a usage refresh, etc.) its auto-deploys collide at the Pages deploy API and
# fail with "Deployment failed, try again later" — one failure email each. This
# workflow serializes deploys through a single `pages` concurrency group and
# cancels superseded in-flight runs, so a burst of pushes yields one successful
# deploy and zero failures. Static site: no build step, the repo root IS the site
# (matches the old .nojekyll "serve files as-is" behavior).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard artifact integrity
        # Mirrors the local push-time guards in scripts/push-to-github.ps1 and
        # scripts/check-status-json.ps1 so a push that bypassed those scripts
        # (raw git push, a different script) still can't ship a truncated
        # index.html, a broken CNAME, or a corrupt status/data/*.json.
        shell: pwsh
        run: |
          & ./scripts/check-status-json.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $indexTail = ((Get-Content index.html -Tail 3) -join "`n").TrimEnd()
          if (-not $indexTail.EndsWith("</html>")) {
            Write-Host "INTEGRITY FAIL: index.html does not end with </html>." -ForegroundColor Red
            exit 1
          }

          $cname = (Get-Content CNAME -Raw).Trim()
          if ($cname -ne "yesandeverything.com") {
            Write-Host "INTEGRITY FAIL: CNAME should be 'yesandeverything.com' but contains: '$cname'" -ForegroundColor Red
            exit 1
          }

          # This guard used to require hordes/index.html to carry a `var ENCODED` line. That
          # file is gone: it held the whole design document as base64 with the access phrase
          # in cleartext a few lines above it, in this PUBLIC repository, so it withheld
          # nothing from anyone who viewed source. Both documents are now served by
          # workers/gated-docs, which resolves a session before reading them out of
          # key-value storage, and neither document is in this repository any more.
          #
          # Inverted rather than deleted, because the risk did not go away, it reversed: a
          # deploy must not quietly put a payload back.
          foreach ($stale in @("hordes/index.html", "brackish-rising/index.html")) {
            if (Test-Path $stale) {
              Write-Host "INTEGRITY FAIL: $stale exists again. The design documents are served" -ForegroundColor Red
              Write-Host "by the gated-docs Worker and must not be committed to this public repo." -ForegroundColor Red
              exit 1
            }
          }

          Write-Host "Artifact integrity guards passed." -ForegroundColor Green
      - name: Stamp live project data into pages
        # Every project release pushes its status/data/<Project>.json here, which
        # triggers this deploy; this step folds those numbers (version, milestone)
        # into the homepage cards and each project's Details/Design pages.
        run: node scripts/update-project-pages.mjs
      - name: Drop VCS metadata from the deploy artifact
        run: rm -rf .git
      - uses: actions/configure-pages@v5
      - name: Upload the site (repo root) as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
