name: debug scratch

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $full = Join-Path (Get-Location) ".gitattributes"
          Write-Host "--- Get-Item plain ---"
          try { $i = Get-Item -LiteralPath $full; Write-Host "OK len=$($i.Length)" } catch { Write-Host "FAIL: $($_.Exception.Message)" }
          Write-Host "--- Get-Item -Force ---"
          try { $i = Get-Item -LiteralPath $full -Force; Write-Host "OK len=$($i.Length)" } catch { Write-Host "FAIL: $($_.Exception.Message)" }
          Write-Host "--- Get-Content -Raw ---"
          try { $t = Get-Content -LiteralPath $full -Raw -Encoding utf8 -ErrorAction Stop; Write-Host "OK chars=$($t.Length)" } catch { Write-Host "FAIL: $($_.Exception.Message)" }
          Write-Host "--- Get-Content -Raw -Force ---"
          try { $t = Get-Content -LiteralPath $full -Raw -Encoding utf8 -Force -ErrorAction Stop; Write-Host "OK chars=$($t.Length)" } catch { Write-Host "FAIL: $($_.Exception.Message)" }
          Write-Host "--- [IO.File]::ReadAllText ---"
          try { $t2 = [System.IO.File]::ReadAllText($full); Write-Host "OK chars=$($t2.Length)" } catch { Write-Host "FAIL: $($_.Exception.Message)" }
          Write-Host "--- [IO.FileInfo] ---"
          try { $fi = [System.IO.FileInfo]::new($full); Write-Host "OK len=$($fi.Length) exists=$($fi.Exists)" } catch { Write-Host "FAIL: $($_.Exception.Message)" }
