name: debug scratch

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash raw check
        run: |
          echo "--- ls -la repo root (bash) ---"
          ls -la | head -30
          echo "--- stat .gitattributes ---"
          stat .gitattributes || echo "stat FAILED"
          echo "--- git ls-files for it ---"
          git ls-files -- .gitattributes
          echo "--- git status ---"
          git status --porcelain=v1 --ignored | head -30
          echo "--- find it explicitly ---"
          find . -maxdepth 1 -iname "*gitattributes*" -o -maxdepth 1 -iname "*gitignore*"
      - shell: pwsh
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          Write-Host "cwd: $(Get-Location)"
          Get-ChildItem -Force -Name | Select-Object -First 15 | ForEach-Object { Write-Host "entry: $_" }
          $full = Join-Path (Get-Location) ".gitattributes"
          Write-Host "full: $full"
          Write-Host "TestPath: $(Test-Path -LiteralPath $full -PathType Leaf)"
          try {
            $item = Get-Item -LiteralPath $full
            Write-Host "GetItem OK, length: $($item.Length)"
          } catch {
            Write-Host "GetItem FAILED: $_"
          }
